<div class="bg-white dark:bg-surface-800 rounded-2xl p-5 border border-gray-100 dark:border-gray-700 shadow-sm flex items-center justify-between {{class}}">
    <div>
        <p class="text-sm font-medium text-gray-500 mb-1">{{title}}</p>
        <h3 class="text-2xl font-bold text-gray-900 dark:text-white" id="{{id}}">{{value}}</h3>
    </div>
    <div class="w-12 h-12 {{icon_bg}} {{icon_text}} rounded-full flex items-center justify-center">
        <i data-lucide="{{icon}}" class="w-6 h-6"></i>
    </div>
</div>
