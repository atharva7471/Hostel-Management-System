<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <script src="../js/core.js"></script>
</head>
<body data-layout="management" data-page-title="Announcements - Management - HostelOS">
<div class="max-w-6xl mx-auto space-y-6">
                <!-- Toolbar -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <h2 class="text-xl font-bold">Publish Notice</h2>
                    <button onclick="openModal('create-announcement-modal')" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-sm font-medium hover:bg-brand-500 transition shadow-sm flex items-center">
                        <i data-lucide="plus" class="w-4 h-4 mr-2"></i> New Announcement
                    </button>
                </div>

                <!-- Announcements Feed -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="announcements-grid">
                    <div class="animate-pulse h-48 bg-white dark:bg-surface-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-sm"></div>
                </div>
            </div>
<script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb' },
                        surface: { 50: '#f9fafb', 100: '#f3f4f6', 800: '#1f2937', 900: '#111827' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <script>
        checkAuth('MANAGEMENT');
        lucide.createIcons();

        async function loadData() {
            try {
                // Load Hostels for dropdown
                const hostels = await fetchAPI('/hostels/');
                const targetSelect = document.getElementById('a-target');
                hostels.forEach(h => {
                    const opt = document.createElement('option');
                    opt.value = h._id;
                    opt.textContent = `Hostel: ${h.name}`;
                    targetSelect.appendChild(opt);
                });

                // Load Announcements
                const data = await fetchAPI('/announcements/');
                const container = document.getElementById('announcements-grid');
                if (data.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-1 md:col-span-2 lg:col-span-3 p-10 text-center bg-white dark:bg-surface-800 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                            <div class="w-16 h-16 bg-gray-50 dark:bg-surface-900/50 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-400">
                                <i data-lucide="megaphone" class="w-8 h-8"></i>
                            </div>
                            <h3 class="text-lg font-medium">No Announcements</h3>
                            <p class="text-gray-500 mt-1">Publish an announcement to notify students.</p>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                container.innerHTML = data.map(a => `
                    <div class="p-6 bg-white dark:bg-surface-800 rounded-2xl border ${a.priority === 'URGENT' ? 'border-red-200 dark:border-red-900/50' : 'border-gray-100 dark:border-gray-700'} shadow-sm flex flex-col h-full relative group">
                        <div class="flex justify-between items-start mb-4">
                            ${getPriorityBadge(a.priority)}
                            <button onclick="deleteAnnouncement('${a._id}')" class="text-gray-400 hover:text-red-500 transition opacity-0 group-hover:opacity-100">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <h3 class="font-semibold text-lg mb-2">${a.title}</h3>
                        <p class="text-sm text-gray-500 mb-4 flex-1 whitespace-pre-wrap">${a.description}</p>
                        <div class="flex items-center justify-between text-xs text-gray-400 pt-4 border-t border-gray-100 dark:border-gray-700">
                            <span class="flex items-center"><i data-lucide="users" class="w-3 h-3 mr-1"></i> ${a.target_audience === 'ALL' ? 'All Students' : 'Specific Hostel'}</span>
                            <span>${new Date(a.created_at).toLocaleDateString()}</span>
                        </div>
                    </div>
                `).join('');
                lucide.createIcons();
            } catch (e) {}
        }

        function getPriorityBadge(p) {
            let colors = {
                'NORMAL': 'bg-gray-100 text-gray-800 dark:bg-gray-800 dark:text-gray-300',
                'IMPORTANT': 'bg-orange-100 text-orange-800 dark:bg-orange-900/30 dark:text-orange-400',
                'URGENT': 'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400'
            };
            return `<span class="px-2 py-0.5 text-[10px] uppercase font-bold rounded ${colors[p] || colors.NORMAL}">${p}</span>`;
        }

        async function submitAnnouncement() {
            const form = document.getElementById('create-form');
            if(!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const payload = {
                title: document.getElementById('a-title').value,
                description: document.getElementById('a-desc').value,
                priority: document.getElementById('a-priority').value,
                target_audience: document.getElementById('a-target').value
            };

            try {
                await fetchAPI('/announcements/', { method: 'POST', body: JSON.stringify(payload) });
                showToast('Announcement published successfully');
                closeModal('create-announcement-modal');
                form.reset();
                loadData();
            } catch (e) {}
        }

        async function deleteAnnouncement(id) {
            if(!confirm("Are you sure you want to delete this announcement?")) return;
            try {
                await fetchAPI(`/announcements/${id}`, { method: 'DELETE' });
                showToast('Deleted');
                loadData();
            } catch (e) {}
        }

        loadData();
    </script>
</body>
</html>
