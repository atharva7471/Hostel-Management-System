<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <script src="../js/core.js"></script>
</head>
<body data-layout="management" data-page-title="Applications - HostelOS Management">
<div class="max-w-7xl mx-auto space-y-6">
                
                <div class="flex flex-col sm:flex-row gap-4 justify-between items-start sm:items-center">
                    <div class="flex items-center gap-2 bg-white dark:bg-surface-800 p-1 rounded-lg border border-gray-200 dark:border-gray-700">
                        <button onclick="setFilter('UNDER_REVIEW')" id="filter-under-review" class="px-4 py-1.5 text-sm font-medium rounded-md bg-brand-50 text-brand-600 dark:bg-brand-900/30 dark:text-brand-400 transition">Pending Review</button>
                        <button onclick="setFilter('APPROVED')" id="filter-approved" class="px-4 py-1.5 text-sm font-medium rounded-md text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition">Approved</button>
                    </div>
                </div>

                <div class="bg-white dark:bg-surface-800 border border-gray-200 dark:border-gray-800 rounded-2xl shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="text-xs text-gray-500 dark:text-gray-400 uppercase bg-gray-50/50 dark:bg-surface-800/50 border-b border-gray-200 dark:border-gray-800">
                                <tr>
                                    <th class="px-6 py-4 font-semibold">Student</th>
                                    <th class="px-6 py-4 font-semibold">Course & Year</th>
                                    <th class="px-6 py-4 font-semibold">Status</th>
                                    <th class="px-6 py-4 font-semibold text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="applications-tbody" class="divide-y divide-gray-100 dark:divide-gray-800">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
<script>
        checkAuth('MANAGEMENT');
        lucide.createIcons();

        let allStudents = [];
        let currentFilter = 'UNDER_REVIEW';

        function setFilter(status) {
            currentFilter = status;
            document.getElementById('filter-under-review').className = \`px-4 py-1.5 text-sm font-medium rounded-md transition \${status === 'UNDER_REVIEW' ? 'bg-brand-50 text-brand-600 dark:bg-brand-900/30 dark:text-brand-400' : 'text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white'}\`;
            document.getElementById('filter-approved').className = \`px-4 py-1.5 text-sm font-medium rounded-md transition \${status === 'APPROVED' ? 'bg-brand-50 text-brand-600 dark:bg-brand-900/30 dark:text-brand-400' : 'text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white'}\`;
            renderTable();
        }

        async function loadApplications() {
            try {
                const data = await fetchAPI('/students/');
                allStudents = data;
                renderTable();
            } catch (e) {}
        }

        function renderTable() {
            const tbody = document.getElementById('applications-tbody');
            
            const filtered = allStudents.filter(s => {
                if (currentFilter === 'UNDER_REVIEW') return s.application_status === 'UNDER_REVIEW';
                if (currentFilter === 'APPROVED') return s.application_status === 'APPROVED' && s.status !== 'ACTIVE_RESIDENT';
                return false;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = \`<tr><td colspan="4" class="px-6 py-12 text-center text-gray-500">No applications found in this state.</td></tr>\`;
                return;
            }

            tbody.innerHTML = filtered.map(s => \`
                <tr class="hover:bg-gray-50/50 dark:hover:bg-surface-800/50 transition">
                    <td class="px-6 py-4">
                        <div class="font-medium text-gray-900 dark:text-white">\${s.full_name}</div>
                        <div class="text-xs text-gray-500 mt-0.5">\${s.student_id || 'No ID'}</div>
                    </td>
                    <td class="px-6 py-4 text-gray-600 dark:text-gray-400">
                        \${s.course || '-'} • Year \${s.year || '-'}
                    </td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium \${s.application_status === 'UNDER_REVIEW' ? 'bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-400' : 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400'}">
                            \${s.application_status}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="viewApplication('\${s._id}')" class="text-brand-600 hover:text-brand-900 dark:text-brand-400 dark:hover:text-brand-300 font-medium text-sm">Review</button>
                    </td>
                </tr>
            \`).join('');
        }

        function viewApplication(id) {
            const s = allStudents.find(x => x._id === id);
            if(!s) return;

            const container = document.getElementById('app-details-container');
            container.innerHTML = \`
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Student Information</h4>
                        <div class="space-y-2 text-sm">
                            <p><span class="text-gray-500">Name:</span> <span class="font-medium">\${s.full_name}</span></p>
                            <p><span class="text-gray-500">Email:</span> \${s.email}</p>
                            <p><span class="text-gray-500">Student ID:</span> \${s.student_id || '-'}</p>
                            <p><span class="text-gray-500">Phone:</span> \${s.phone || '-'}</p>
                            <p><span class="text-gray-500">Course & Year:</span> \${s.course || '-'} (\${s.year || '-'})</p>
                        </div>
                    </div>
                    <div>
                        <h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Emergency Contact</h4>
                        <div class="space-y-2 text-sm">
                            <p><span class="text-gray-500">Guardian Name:</span> <span class="font-medium">\${s.guardian_name || '-'}</span></p>
                            <p><span class="text-gray-500">Guardian Phone:</span> \${s.guardian_phone || '-'}</p>
                        </div>
                    </div>
                </div>
                
                <div class="pt-4 border-t border-gray-100 dark:border-gray-700">
                    <h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Hostel Preferences</h4>
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div class="bg-gray-50 dark:bg-surface-900 p-3 rounded-xl border border-gray-100 dark:border-gray-700">
                            <p class="text-gray-500 text-xs mb-1">Preferred Hostel</p>
                            <p class="font-medium">\${s.preferred_hostel || 'No Preference'}</p>
                        </div>
                        <div class="bg-gray-50 dark:bg-surface-900 p-3 rounded-xl border border-gray-100 dark:border-gray-700">
                            <p class="text-gray-500 text-xs mb-1">Preferred Room Type</p>
                            <p class="font-medium">\${s.preferred_room_type || 'Single'}</p>
                        </div>
                    </div>
                    <div class="mt-4 bg-gray-50 dark:bg-surface-900 p-3 rounded-xl border border-gray-100 dark:border-gray-700">
                        <p class="text-gray-500 text-xs mb-1">Special Requirements</p>
                        <p class="text-sm">\${s.special_requirements || 'None'}</p>
                    </div>
                </div>
            \`;

            const actions = document.getElementById('app-actions');
            if (s.application_status === 'UNDER_REVIEW') {
                actions.innerHTML = \`
                    <button onclick="updateAppStatus('\${s._id}', 'REJECTED')" class="px-4 py-2 text-sm font-medium text-red-600 bg-red-50 rounded-xl hover:bg-red-100 transition">Reject</button>
                    <button onclick="updateAppStatus('\${s._id}', 'CHANGES_REQUESTED')" class="px-4 py-2 text-sm font-medium text-orange-600 bg-orange-50 rounded-xl hover:bg-orange-100 transition">Request Changes</button>
                    <button onclick="updateAppStatus('\${s._id}', 'APPROVED')" class="px-4 py-2 text-sm font-medium text-white bg-green-600 rounded-xl hover:bg-green-500 transition">Approve Application</button>
                \`;
            } else if (s.application_status === 'APPROVED') {
                actions.innerHTML = \`
                    <button onclick="closeModal('app-modal')" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-xl hover:bg-gray-200">Close</button>
                    <button onclick="openAllocModal('\${s._id}')" class="px-4 py-2 text-sm font-medium text-white bg-brand-600 rounded-xl hover:bg-brand-500 transition">Assign Room</button>
                \`;
            }

            openModal('app-modal');
        }

        async function updateAppStatus(id, status) {
            try {
                await fetchAPI(\`/students/\${id}/application\`, {
                    method: 'PATCH',
                    body: JSON.stringify({ status })
                });
                showToast(\`Application marked as \${status}\`);
                closeModal('app-modal');
                loadApplications();
            } catch (e) {}
        }

        // --- Allocation Logic ---
        let hostelsCache = [];
        let roomsCache = [];

        async function openAllocModal(studentId) {
            closeModal('app-modal');
            document.getElementById('alloc-student-id').value = studentId;
            
            // Reset fields
            document.getElementById('alloc-room').innerHTML = '<option value="">Choose Room...</option>';
            document.getElementById('alloc-room').disabled = true;
            document.getElementById('alloc-bed').innerHTML = '<option value="">Choose Bed...</option>';
            document.getElementById('alloc-bed').disabled = true;

            try {
                hostelsCache = await fetchAPI('/hostels/');
                const hSelect = document.getElementById('alloc-hostel');
                hSelect.innerHTML = '<option value="">Choose Hostel...</option>' + 
                    hostelsCache.map(h => \`<option value="\${h._id}">\${h.name}</option>\`).join('');
                openModal('allocate-modal');
            } catch (e) {}
        }

        async function loadRoomsForAlloc() {
            const hid = document.getElementById('alloc-hostel').value;
            const rSelect = document.getElementById('alloc-room');
            const bSelect = document.getElementById('alloc-bed');
            
            rSelect.innerHTML = '<option value="">Choose Room...</option>';
            rSelect.disabled = true;
            bSelect.innerHTML = '<option value="">Choose Bed...</option>';
            bSelect.disabled = true;

            if (!hid) return;

            try {
                roomsCache = await fetchAPI(\`/rooms/hostel/\${hid}\`);
                const availableRooms = roomsCache.filter(r => r.beds.some(b => b.status === 'AVAILABLE'));
                
                rSelect.innerHTML = '<option value="">Choose Room...</option>' + 
                    availableRooms.map(r => \`<option value="\${r._id}">\${r.room_number} (Type: \${r.room_type})</option>\`).join('');
                rSelect.disabled = false;
            } catch (e) {}
        }

        function loadBedsForAlloc() {
            const rid = document.getElementById('alloc-room').value;
            const bSelect = document.getElementById('alloc-bed');
            bSelect.innerHTML = '<option value="">Choose Bed...</option>';
            bSelect.disabled = true;

            if (!rid) return;

            const room = roomsCache.find(r => r._id === rid);
            if (room) {
                const availBeds = room.beds.filter(b => b.status === 'AVAILABLE');
                bSelect.innerHTML = '<option value="">Choose Bed...</option>' + 
                    availBeds.map(b => \`<option value="\${b.bed_number}">Bed \${b.bed_number}</option>\`).join('');
                bSelect.disabled = false;
            }
        }

        async function submitAllocation() {
            const studentId = document.getElementById('alloc-student-id').value;
            const roomId = document.getElementById('alloc-room').value;
            const bedNo = parseInt(document.getElementById('alloc-bed').value);

            if (!roomId || !bedNo) {
                showToast('Please select room and bed', 'error');
                return;
            }

            try {
                await fetchAPI(\`/rooms/\${roomId}/allocate\`, {
                    method: 'POST',
                    body: JSON.stringify({
                        student_id: studentId,
                        bed_number: bedNo
                    })
                });
                showToast('Bed allocated successfully and Hostel Identity created!');
                closeModal('allocate-modal');
                loadApplications(); // refresh lists
            } catch (e) {}
        }

        document.addEventListener('LayoutLoaded', loadApplications);
    </script>
</body>
</html>
